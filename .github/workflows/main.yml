name: Generate Arcade Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # =========================
      # PAC-MAN — реальные коммиты
      # =========================
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "aggressive"
          hide_month_labels: "true"


      # =========================
      # SNAKE — отдельная аркадная анимация
      # =========================
      - name: Install Pillow
        run: |
          python3 -m pip install --quiet pillow


           - name: Generate Arcade Snake
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw
          import random
          import os

          random.seed()

          # =========================
          # ПОЛЕ
          # =========================

          COLS = 48
          ROWS = 7
          CELL = 15

          WIDTH = COLS * CELL
          HEIGHT = ROWS * CELL

          FRAMES = 180
          FPS = 8

          # =========================
          # ЦВЕТА
          # =========================

          BG = "#05070f"
          GRID = "#0a1122"

          SNAKE = "#00d4ff"
          HEAD = "#a0f0ff"

          MUSHROOM = "#7d4cff"
          MUSHROOM_LIGHT = "#b88cff"
          STEM = "#dffaff"

          # =========================
          # ЗМЕЯ
          # =========================

          snake = [
              (5, 3),
              (4, 3),
              (3, 3),
              (2, 3),
              (1, 3)
          ]

          # =========================
          # ГРИБЫ
          # =========================

          mushrooms = []


          def free_position():
              while True:
                  pos = (
                      random.randint(1, COLS - 2),
                      random.randint(0, ROWS - 1)
                  )

                  if pos not in snake and pos not in mushrooms:
                      return pos


          # Сразу создаём несколько грибов
          for _ in range(6):
              mushrooms.append(free_position())


          # =========================
          # ВЫБИРАЕМ БЛИЖАЙШИЙ ГРИБ
          # =========================

          def nearest_mushroom():

              head_x, head_y = snake[0]

              return min(
                  mushrooms,
                  key=lambda mushroom:
                  abs(mushroom[0] - head_x) +
                  abs(mushroom[1] - head_y)
              )


          # =========================
          # ДВИЖЕНИЕ К ГРИБУ
          # =========================

          def next_position():

              head_x, head_y = snake[0]

              target_x, target_y = nearest_mushroom()

              x = head_x
              y = head_y

              # Сначала двигаемся по горизонтали
              if x != target_x:

                  if target_x > x:
                      x += 1
                  else:
                      x -= 1

              # Когда дошли по X —
              # двигаемся по вертикали
              elif y != target_y:

                  if target_y > y:
                      y += 1
                  else:
                      y -= 1

              return x, y


          # =========================
          # РИСОВАНИЕ ГРИБА
          # =========================

          def draw_mushroom(draw, x, y):

              px = x * CELL
              py = y * CELL

              # свечение
              draw.ellipse(
                  (
                      px + 1,
                      py + 1,
                      px + CELL - 1,
                      py + CELL - 1
                  ),
                  fill="#102b45"
              )

              # ножка
              draw.rounded_rectangle(
                  (
                      px + 5,
                      py + 7,
                      px + 10,
                      py + 13
                  ),
                  radius=2,
                  fill=STEM
              )

              # шляпка
              draw.ellipse(
                  (
                      px + 2,
                      py + 2,
                      px + CELL - 2,
                      py + 10
                  ),
                  fill=MUSHROOM
              )

              # блики
              draw.ellipse(
                  (
                      px + 5,
                      py + 4,
                      px + 7,
                      py + 6
                  ),
                  fill=MUSHROOM_LIGHT
              )

              draw.ellipse(
                  (
                      px + 9,
                      py + 5,
                      px + 11,
                      py + 7
                  ),
                  fill=MUSHROOM_LIGHT
              )


          # =========================
          # СОЗДАЁМ КАДРЫ
          # =========================

          frames = []

          for frame in range(FRAMES):

              # Следующая клетка всегда выбирается
              # в сторону ближайшего гриба
              new_head = next_position()

              snake.insert(0, new_head)

              # =========================
              # ГРИБ СЪЕДЕН
              # =========================

              if new_head in mushrooms:

                  mushrooms.remove(new_head)

                  # Новый гриб появляется
                  # в другом случайном месте
                  mushrooms.append(
                      free_position()
                  )

                  # Немного увеличиваем змею
                  if len(snake) < 10:
                      snake.append(snake[-1])

              else:

                  # Обычное движение
                  snake.pop()


              # =========================
              # КАДР
              # =========================

              img = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  BG
              )

              draw = ImageDraw.Draw(img)


              # =========================
              # СЕТКА
              # =========================

              for x in range(0, WIDTH, CELL):

                  draw.line(
                      (x, 0, x, HEIGHT),
                      fill=GRID,
                      width=1
                  )


              for y in range(0, HEIGHT, CELL):

                  draw.line(
                      (0, y, WIDTH, y),
                      fill=GRID,
                      width=1
                  )


              # =========================
              # ГРИБЫ
              # =========================

              for mushroom in mushrooms:

                  draw_mushroom(
                      draw,
                      mushroom[0],
                      mushroom[1]
                  )


              # =========================
              # ТЕЛО ЗМЕИ
              # =========================

              for x, y in reversed(snake):

                  px = x * CELL
                  py = y * CELL

                  draw.rounded_rectangle(
                      (
                          px + 3,
                          py + 3,
                          px + CELL - 3,
                          py + CELL - 3
                      ),
                      radius=4,
                      fill=SNAKE
                  )


              # =========================
              # ГОЛОВА
              # =========================

              hx, hy = snake[0]

              px = hx * CELL
              py = hy * CELL

              draw.rounded_rectangle(
                  (
                      px + 2,
                      py + 2,
                      px + CELL - 2,
                      py + CELL - 2
                  ),
                  radius=5,
                  fill=HEAD
              )


              # =========================
              # ГЛАЗА
              # =========================

              draw.ellipse(
                  (
                      px + 4,
                      py + 4,
                      px + 6,
                      py + 6
                  ),
                  fill=BG
              )

              draw.ellipse(
                  (
                      px + 9,
                      py + 4,
                      px + 11,
                      py + 6
                  ),
                  fill=BG
              )


              frames.append(img)


          # =========================
          # СОХРАНЕНИЕ
          # =========================

          os.makedirs("dist", exist_ok=True)

          frames[0].save(
              "dist/arcade-snake.gif",
              save_all=True,
              append_images=frames[1:],
              duration=int(1000 / FPS),
              loop=0,
              optimize=True
          )

          print("Snake generated successfully.")
          PY

      # =========================
      # ПУБЛИКАЦИЯ
      # =========================
      - name: Publish
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
