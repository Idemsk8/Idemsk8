name: generate arcade graphs

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ═══════════ ПАКМАН ═══════════
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # ═══════════ КАСТОМНАЯ ЗМЕЙКА ═══════════
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create dist folder
        run: mkdir -p dist

      - name: Generate custom neon snake
        run: |
          python3 - << 'PYEOF'
          import random

          # ═══ НАСТРОЙКИ ═══
          COLS, ROWS = 53, 7            # размер поля
          CELL, GAP = 11, 2             # размер клетки и отступ
          SNAKE_LEN = 8                 # длина змейки (сегментов)
          NUM_DOTS = 120                # сколько точек
          SPEED = 0.15                  # секунд на одну клетку
          BG_COLOR    = "#05070f"       # фон
          CELL_COLOR  = "#0a1122"       # клетки
          DOT_COLOR   = "#00aaff"       # точки
          SNAKE_COLOR = "#00d4ff"       # змейка
          HEAD_COLOR  = "#66e6ff"       # голова

          W = COLS * (CELL + GAP)
          H = ROWS * (CELL + GAP)

          # ═══ ПЛАВНЫЙ ЗМЕИНЫЙ ПУТЬ (змейкой — заполняет все клетки) ═══
          path = []
          for col in range(COLS):
              rows_order = range(ROWS) if col % 2 == 0 else reversed(range(ROWS))
              for row in rows_order:
                  path.append((col, row))

          # ═══ РАНДОМНЫЕ ТОЧКИ ═══
          random.seed()
          dots = set()
          while len(dots) < NUM_DOTS:
              dots.add((random.randint(0, COLS - 1), random.randint(0, ROWS - 1)))

          def xy(c, r):
              return c * (CELL + GAP) + CELL / 2, r * (CELL + GAP) + CELL / 2

          # ═══ SVG-ПУТЬ ═══
          path_str = " ".join(
              f'{"M" if i == 0 else "L"} {xy(c, r)[0]:.1f} {xy(c, r)[1]:.1f}'
              for i, (c, r) in enumerate(path)
          )

          DUR = len(path) * SPEED

          # ═══ СБОРКА SVG ═══
          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              '<defs>',
              '<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">',
              '<feGaussianBlur stdDeviation="3" result="b"/>',
              '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>',
              '</filter>',
              '<radialGradient id="dotGlow"><stop offset="0%" stop-color="#00d4ff" stop-opacity="1"/><stop offset="100%" stop-color="#00aaff" stop-opacity="0.3"/></radialGradient>',
              '</defs>',
              f'<rect width="{W}" height="{H}" fill="{BG_COLOR}"/>',
          ]

          # Клетки
          for col in range(COLS):
              for row in range(ROWS):
                  x = col * (CELL + GAP)
                  y = row * (CELL + GAP)
                  parts.append(f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" rx="2" fill="{CELL_COLOR}" stroke="#0a2a4d" stroke-width="0.5"/>')

          # Точки (рандомные)
          for (col, row) in dots:
              cx, cy = xy(col, row)
              parts.append(f'<circle cx="{cx:.1f}" cy="{cy:.1f}" r="1.5" fill="{DOT_COLOR}" opacity="0.85"/>')

          # Змейка — сегменты с задержкой (голова впереди)
          for i in range(SNAKE_LEN):
              delay = -i * SPEED
              opacity = max(0.2, 1 - i * 0.1)
              r = CELL / 2 - 0.5 if i == 0 else CELL / 2 - 1.5
              color = HEAD_COLOR if i == 0 else SNAKE_COLOR
              parts.append(
                  f'<circle r="{r}" fill="{color}" opacity="{opacity}" filter="url(#glow)">'
                  f'<animateMotion dur="{DUR:.2f}s" repeatCount="indefinite" begin="{delay:.2f}s" path="{path_str}"/>'
                  f'</circle>'
              )

          parts.append('</svg>')

          with open('dist/custom-snake.svg', 'w') as f:
              f.write('\n'.join(parts))
          print('✅ Custom snake generated')
          PYEOF

      # ═══════════ ПЕРЕКРАСКА ПАКМАНА ═══════════
      - name: Recolor Pacman to blue neon
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          def brightness(h):
              h = h.lstrip('#')
              r, g, b = int(h[0:2], 16), int(h[2:4], 16), int(h[4:6], 16)
              return r * 0.299 + g * 0.587 + b * 0.114

          def to_neon(hex_color):
              h = hex_color.lstrip('#').lower()
              if h in ('ffffff', 'fefefe', 'fdfdfd', 'f0f0f0'):
                  return '#' + h
              if brightness(h) < 15:
                  return '#05070f'
              b = brightness(h)
              if b < 60:  return '#0a1122'
              if b < 110: return '#0a2a4d'
              if b < 160: return '#0066cc'
              if b < 210: return '#00aaff'
              return '#00d4ff'

          for svg in Path('dist').glob('pacman*.svg'):
              content = svg.read_text()
              colors = set(re.findall(r'#[0-9a-fA-F]{6}', content))
              for c in colors:
                  content = content.replace(c, to_neon(c))
              svg.write_text(content)
              print(f'✅ Recolored: {svg.name}')
          EOF

      # ═══════════ ПУБЛИКАЦИЯ ═══════════
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
