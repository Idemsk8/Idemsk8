name: generate arcade graphs

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Пакман
      - name: Generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare dist
        run: mkdir -p dist

      # 3. Змейка с грибами
      - name: Generate neon snake
        run: |
          python3 - << 'PYEOF'
          import random

          # ════ НАСТРОЙКИ ════
          COLS, ROWS = 53, 7
          CELL, GAP  = 11, 2
          SNAKE_LEN  = 8
          NUM_DOTS   = 20
          SPEED      = 20.20          # секунд на одну клетку

          BG     = "#05070f"
          CELLBG = "#0a1122"
          MCAP   = "#00d4ff"
          MSTEM  = "#66e6ff"
          MDOT   = "#ffffff"
          SNAKE  = "#00d4ff"
          HEAD   = "#a0f0ff"

          W = COLS * (CELL + GAP)
          H = ROWS * (CELL + GAP)

          # ════ БОЛЬШОЙ КРУГ ПО ПЕРИМЕТРУ ════
          path = []
          # верх: слева направо
          for c in range(COLS): path.append((c, 0))
          # право: вниз
          for r in range(1, ROWS): path.append((COLS - 1, r))
          # низ: справа налево
          for c in range(COLS - 2, -1, -1): path.append((c, ROWS - 1))
          # лево: вверх
          for r in range(ROWS - 2, 0, -1): path.append((0, r))

          L = len(path)
          DUR = L * SPEED

          # ════ РАНДОМНЫЕ ГРИБЫ ТОЛЬКО НА ПУТИ ════
          random.seed()
          dots = set()
          while len(dots) < NUM_DOTS:
              dots.add(random.choice(path))

          def xy(c, r):
              return c * (CELL + GAP) + CELL / 2, r * (CELL + GAP) + CELL / 2

          path_str = " ".join(
              f'{"M" if i == 0 else "L"} {xy(c, r)[0]:.1f} {xy(c, r)[1]:.1f}'
              for i, (c, r) in enumerate(path)
          )

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              '<defs>',
              '<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">',
              '<feGaussianBlur stdDeviation="2.5" result="b"/>',
              '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>',
              '</filter>',
              '<g id="mushroom">',
              f'<path d="M -4.5,1 A 4.5,4 0 0 1 4.5,1 Z" fill="{MCAP}"/>',
              f'<circle cx="-2.2" cy="-1.5" r="0.8" fill="{MDOT}"/>',
              f'<circle cx="2.2" cy="-1.5" r="0.8" fill="{MDOT}"/>',
              f'<circle cx="0" cy="-2.8" r="0.6" fill="{MDOT}"/>',
              f'<rect x="-1.8" y="1" width="3.6" height="3" rx="0.5" fill="{MSTEM}"/>',
              '</g>',
              '</defs>',
              f'<rect width="{W}" height="{H}" fill="{BG}"/>',
          ]

          for col in range(COLS):
              for row in range(ROWS):
                  x = col * (CELL + GAP)
                  y = row * (CELL + GAP)
                  parts.append(
                      f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" '
                      f'rx="2" fill="{CELLBG}" stroke="#0a2a4d" stroke-width="0.5"/>'
                  )

          # ════ ГРИБЫ — ИСЧЕЗАЮТ ПОД ГОЛОВОЙ ════
          # Голова опережает хвост на (SNAKE_LEN-1) клеток.
          # Голова приходит в клетку j за (L-1)/L*DUR раньше хвоста.
          lead = (SNAKE_LEN - 1) / L

          for idx, (col, row) in enumerate(path):
              if (col, row) not in dots: continue
              cx, cy = xy(col, row)

              t_tail = idx / L
              t_head = t_tail - lead
              if t_head < 0: t_head += 1.0

              # гриб исчезает за 0.02 до головы и остаётся невидимым 0.06 цикла
              t1 = max(0.001, t_head - 0.005)
              t2 = min(0.998, t_head + 0.06)

              parts.append(f'<g transform="translate({cx:.1f},{cy:.1f})" filter="url(#glow)">')
              parts.append('<use href="#mushroom"/>')
              parts.append(
                  f'<animate attributeName="opacity" '
                  f'values="1;1;0;1;1" '
                  f'keyTimes="0;{t1:.4f};{t1:.4f};{t2:.4f};1" '
                  f'dur="{DUR:.2f}s" repeatCount="indefinite"/>'
              )
              parts.append('</g>')

          # ════ ЗМЕЙКА: ГОЛОВА ВПЕРЕДИ, ОГРОМНАЯ ════
          for i in range(SNAKE_LEN):
              # i=0 — голова, самая ранняя задержка → она «уходит» вперед
              delay = -i * SPEED * -1  # т.е. delay = i*SPEED для хвоста
              # На самом деле: голова ДОЛЖНА опережать — используем отрицательный begin
              begin = -(SNAKE_LEN - 1 - i) * SPEED  # i=0: -(7)*S, i=7: 0
              r = CELL / 2 - 0.5 if i == 0 else CELL / 2 - 2
              color = HEAD if i == 0 else SNAKE
              opacity = 1 if i == 0 else max(0.35, 1 - i * 0.08)
              parts.append(
                  f'<circle r="{r}" fill="{color}" opacity="{opacity}" filter="url(#glow)">'
                  f'<animateMotion dur="{DUR:.2f}s" repeatCount="indefinite" '
                  f'begin="{begin:.3f}s" path="{path_str}"/>'
                  f'</circle>'
              )

          parts.append('</svg>')

          with open('dist/custom-snake.svg', 'w') as f:
              f.write('\n'.join(parts))
          print('✅ Snake generated')
          PYEOF

      # 4. Пакман → голубика (более насыщенный фиолет)
      - name: Recolor Pacman to blueberry
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          def lum(h):
              h = h.lstrip('#')
              r, g, b = int(h[0:2],16), int(h[2:4],16), int(h[4:6],16)
              return r*0.299 + g*0.587 + b*0.114

          def blueberry(h):
              h = h.lstrip('#').lower()
              if h in ('ffffff','fefefe','fdfdfd','f0f0f0','ebedf0','eeeeee'):
                  return '#' + h
              L = lum(h)
              if L < 12:  return '#150726'   # почти чёрный → очень тёмный фиолет
              if L < 55:  return '#2d0f4f'   # тёмно-фиолетовый
              if L < 110: return '#5c1f9e'   # средний фиолет
              if L < 175: return '#8c4df5'   # яркая голубика
              return '#b380ff'               # спелая голубика

          for svg in Path('dist').glob('pacman*.svg'):
              txt = svg.read_text()
              colors = set(re.findall(r'#[0-9a-fA-F]{6}', txt))
              for c in colors:
                  txt = txt.replace(c, blueberry(c))
              svg.write_text(txt)
              print(f'✅ Blueberry: {svg.name} ({len(colors)} colors)')
          EOF

      # 5. Публикация
      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
