name: generate arcade graphs

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create dist folder
        run: mkdir -p dist

      # ═══════════ НЕОНОВАЯ ЗМЕЙКА С ГРИБАМИ v3 ═══════════
      - name: Generate neon snake with mushrooms
        run: |
          python3 - << 'PYEOF'
          import random

          # ═══ НАСТРОЙКИ ═══
          COLS, ROWS = 53, 7
          CELL, GAP  = 11, 2
          SNAKE_LEN  = 8
          NUM_DOTS   = 20       # ← ТОЛЬКО 20 грибов
          SPEED      = 0.18

          BG_COLOR      = "#05070f"
          CELL_COLOR    = "#0a1122"
          MUSHROOM_CAP  = "#00d4ff"
          MUSHROOM_STEM = "#66e6ff"
          MUSHROOM_DOT  = "#ffffff"
          SNAKE_COLOR   = "#00d4ff"
          HEAD_COLOR    = "#66e6ff"

          W = COLS * (CELL + GAP)
          H = ROWS * (CELL + GAP)

          # ═══ ПЛАВНЫЙ БОЛЬШОЙ КРУГ (по спирали) ═══
          # Идём по внешнему периметру, потом по внутреннему — как круг
          path = []
          visited = set()

          def add_ring(r1, r2, c1, c2):
              # верхняя строка слева → направо
              for c in range(c1, c2 + 1):
                  if (c, r1) not in visited:
                      path.append((c, r1)); visited.add((c, r1))
              # правая колонка сверху → вниз
              for r in range(r1 + 1, r2 + 1):
                  if (c2, r) not in visited:
                      path.append((c2, r)); visited.add((c2, r))
              # нижняя строка справа → налево
              for c in range(c2 - 1, c1 - 1, -1):
                  if (c, r2) not in visited:
                      path.append((c, r2)); visited.add((c, r2))
              # левая колонка снизу → вверх
              for r in range(r2 - 1, r1, -1):
                  if (c1, r) not in visited:
                      path.append((c1, r)); visited.add((c1, r))

          # Спираль: сужаемся к центру
          top, bottom, left, right = 0, ROWS - 1, 0, COLS - 1
          while top <= bottom and left <= right:
              add_ring(top, bottom, left, right)
              top += 1; bottom -= 1; left += 1; right -= 1

          cell_time = {cell: i / len(path) for i, cell in enumerate(path)}
          DUR = len(path) * SPEED

          # ═══ 20 ГРИБОВ ═══
          random.seed()
          dots = set()
          while len(dots) < NUM_DOTS:
              dots.add((random.randint(0, COLS - 1), random.randint(0, ROWS - 1)))

          def xy(c, r):
              return c * (CELL + GAP) + CELL / 2, r * (CELL + GAP) + CELL / 2

          path_str = " ".join(
              f'{"M" if i == 0 else "L"} {xy(c, r)[0]:.1f} {xy(c, r)[1]:.1f}'
              for i, (c, r) in enumerate(path)
          )

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              '<defs>',
              '<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">',
              '<feGaussianBlur stdDeviation="2.5" result="b"/>',
              '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>',
              '</filter>',
              '<g id="mushroom">',
              f'<path d="M -4.5,1 A 4.5,4 0 0 1 4.5,1 Z" fill="{MUSHROOM_CAP}"/>',
              f'<circle cx="-2.2" cy="-1.5" r="0.8" fill="{MUSHROOM_DOT}"/>',
              f'<circle cx="2.2" cy="-1.5" r="0.8" fill="{MUSHROOM_DOT}"/>',
              f'<circle cx="0" cy="-2.8" r="0.6" fill="{MUSHROOM_DOT}"/>',
              f'<rect x="-1.8" y="1" width="3.6" height="3" rx="0.5" fill="{MUSHROOM_STEM}"/>',
              '</g>',
              '</defs>',
              f'<rect width="{W}" height="{H}" fill="{BG_COLOR}"/>',
          ]

          for col in range(COLS):
              for row in range(ROWS):
                  x = col * (CELL + GAP); y = row * (CELL + GAP)
                  parts.append(
                      f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" '
                      f'rx="2" fill="{CELL_COLOR}" stroke="#0a2a4d" stroke-width="0.5"/>'
                  )

          # 🍄 Грибы: исчезают ровно в момент, когда змейка их ест,
          # и через короткий промежуток «респавнятся»
          for (col, row) in dots:
              cx, cy = xy(col, row)
              t_eat = cell_time[(col, row)]
              t1 = max(0.001, t_eat - 0.001)
              t2 = min(0.999, t_eat + 0.02)   # короткое окно невидимости

              parts.append(f'<g transform="translate({cx:.1f},{cy:.1f})" filter="url(#glow)">')
              parts.append('<use href="#mushroom"/>')
              parts.append(
                  f'<animate attributeName="opacity" '
                  f'values="1;1;0;1;1" '
                  f'keyTimes="0;{t1:.4f};{t1:.4f};{t2:.4f};1" '
                  f'dur="{DUR:.2f}s" repeatCount="indefinite"/>'
              )
              parts.append('</g>')

          # 🐍 Голова вперёд — ИСПРАВЛЕНО
          for i in range(SNAKE_LEN):
              # i=0 голова → самая «ранняя» позиция = самый отрицательный begin
              delay = -(SNAKE_LEN - 1 - i) * SPEED
              opacity = max(0.25, 1 - i * 0.1)
              r = CELL / 2 - 0.5 if i == 0 else CELL / 2 - 1.5
              color = HEAD_COLOR if i == 0 else SNAKE_COLOR
              parts.append(
                  f'<circle r="{r}" fill="{color}" opacity="{opacity}" filter="url(#glow)">'
                  f'<animateMotion dur="{DUR:.2f}s" repeatCount="indefinite" '
                  f'begin="{delay:.2f}s" path="{path_str}"/>'
                  f'</circle>'
              )

          parts.append('</svg>')

          with open('dist/custom-snake.svg', 'w') as f:
              f.write('\n'.join(parts))
          print('✅ Neon snake generated')
          PYEOF

      # ═══════════ ПЕРЕКРАСКА ПАКМАНА → ГОЛУБИКА ═══════════
      - name: Recolor Pacman to blueberry
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          def brightness(h):
              h = h.lstrip('#')
              r, g, b = int(h[0:2], 16), int(h[2:4], 16), int(h[4:6], 16)
              return r * 0.299 + g * 0.587 + b * 0.114

          def to_blueberry(hex_color):
              h = hex_color.lstrip('#').lower()
              # Белый оставляем для глаз
              if h in ('ffffff', 'fefefe', 'fdfdfd', 'f0f0f0'):
                  return '#' + h
              b = brightness(h)
              if b < 15:  return '#05070f'   # фон
              if b < 60:  return '#0a1122'   # тёмный фон
              if b < 110: return '#1a1a4e'   # тёмная голубика
              if b < 160: return '#3b3b98'   # средняя голубика
              if b < 210: return '#6666cc'   # светлая голубика
              return '#8a8aff'               # яркая голубика (спелая)

          for svg in Path('dist').glob('pacman*.svg'):
              content = svg.read_text()
              colors = set(re.findall(r'#[0-9a-fA-F]{6}', content))
              for c in colors:
                  content = content.replace(c, to_blueberry(c))
              svg.write_text(content)
              print(f'✅ Blueberry: {svg.name}')
          EOF

      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
