name: generate arcade graphs

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create dist folder
        run: mkdir -p dist

      # ═══════════ ЗМЕЙКА v4 — БОЛЬШОЙ КРУГ ═══════════
      - name: Generate neon snake
        run: |
          python3 - << 'PYEOF'
          import random

          COLS, ROWS = 53, 7
          CELL, GAP  = 11, 2
          SNAKE_LEN  = 8
          NUM_DOTS   = 20
          SPEED      = 0.18

          BG_COLOR      = "#05070f"
          CELL_COLOR    = "#0a1122"
          MUSHROOM_CAP  = "#00d4ff"
          MUSHROOM_STEM = "#66e6ff"
          MUSHROOM_DOT  = "#ffffff"
          SNAKE_COLOR   = "#00d4ff"
          HEAD_COLOR    = "#66e6ff"

          W = COLS * (CELL + GAP)
          H = ROWS * (CELL + GAP)

          # ═══ БОЛЬШОЙ КРУГ ПО ПЕРИМЕТРУ ═══
          path = []
          # верх: слева → направо
          for c in range(COLS):
              path.append((c, 0))
          # право: сверху → вниз
          for r in range(1, ROWS):
              path.append((COLS - 1, r))
          # низ: справа → налево
          for c in range(COLS - 2, -1, -1):
              path.append((c, ROWS - 1))
          # лево: снизу → вверх
          for r in range(ROWS - 2, 0, -1):
              path.append((0, r))
          # замыкаем круг
          path.append((0, 0))

          L = len(path)
          cell_time = {cell: i / L for i, cell in enumerate(path)}
          DUR = L * SPEED
          # сколько секунд голова «убежала» вперёд хвоста
          HEAD_OFFSET_FRACTION = (SNAKE_LEN - 1) / L

          # ═══ 20 ГРИБОВ (только на клетках периметра — чтобы змейка их точно съела) ═══
          random.seed()
          perimeter = list(set(path))
          dots = set()
          while len(dots) < NUM_DOTS:
              dots.add(random.choice(perimeter))

          def xy(c, r):
              return c * (CELL + GAP) + CELL / 2, r * (CELL + GAP) + CELL / 2

          path_str = " ".join(
              f'{"M" if i == 0 else "L"} {xy(c, r)[0]:.1f} {xy(c, r)[1]:.1f}'
              for i, (c, r) in enumerate(path)
          )

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              '<defs>',
              '<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">',
              '<feGaussianBlur stdDeviation="2.5" result="b"/>',
              '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>',
              '</filter>',
              '<g id="mushroom">',
              f'<path d="M -4.5,1 A 4.5,4 0 0 1 4.5,1 Z" fill="{MUSHROOM_CAP}"/>',
              f'<circle cx="-2.2" cy="-1.5" r="0.8" fill="{MUSHROOM_DOT}"/>',
              f'<circle cx="2.2" cy="-1.5" r="0.8" fill="{MUSHROOM_DOT}"/>',
              f'<circle cx="0" cy="-2.8" r="0.6" fill="{MUSHROOM_DOT}"/>',
              f'<rect x="-1.8" y="1" width="3.6" height="3" rx="0.5" fill="{MUSHROOM_STEM}"/>',
              '</g>',
              '</defs>',
              f'<rect width="{W}" height="{H}" fill="{BG_COLOR}"/>',
          ]

          for col in range(COLS):
              for row in range(ROWS):
                  x = col * (CELL + GAP); y = row * (CELL + GAP)
                  parts.append(
                      f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" '
                      f'rx="2" fill="{CELL_COLOR}" stroke="#0a2a4d" stroke-width="0.5"/>'
                  )

          # 🍄 Грибы — исчезают ТОЧНО под головой (с учётом её опережения)
          for (col, row) in dots:
              cx, cy = xy(col, row)
              t_tail = cell_time[(col, row)]            # когда тут будет хвост
              t_head = t_tail - HEAD_OFFSET_FRACTION    # а тут — голова

              if t_head < 0:
                  t_head += 1.0                          # голова прошла тут в конце цикла

              t1 = max(0.001, min(0.999, t_head - 0.002))
              t2 = min(0.999, t1 + 0.015)

              parts.append(f'<g transform="translate({cx:.1f},{cy:.1f})" filter="url(#glow)">')
              parts.append('<use href="#mushroom"/>')
              parts.append(
                  f'<animate attributeName="opacity" '
                  f'values="1;1;0;1;1" '
                  f'keyTimes="0;{t1:.4f};{t1:.4f};{t2:.4f};1" '
                  f'dur="{DUR:.2f}s" repeatCount="indefinite"/>'
              )
              parts.append('</g>')

          # 🐍 Тело: голова (i=0) идёт ПЕРВОЙ
          for i in range(SNAKE_LEN):
              delay = -(SNAKE_LEN - 1 - i) * SPEED
              opacity = max(0.3, 1 - i * 0.08)
              r = CELL / 2 - 0.5 if i == 0 else CELL / 2 - 1.5
              color = HEAD_COLOR if i == 0 else SNAKE_COLOR
              parts.append(
                  f'<circle r="{r}" fill="{color}" opacity="{opacity}" filter="url(#glow)">'
                  f'<animateMotion dur="{DUR:.2f}s" repeatCount="indefinite" '
                  f'begin="{delay:.2f}s" path="{path_str}"/>'
                  f'</circle>'
              )

          parts.append('</svg>')

          with open('dist/custom-snake.svg', 'w') as f:
              f.write('\n'.join(parts))
          print('✅ Snake v4 generated')
          PYEOF

      # ═══════════ ПАКМАН → ГОЛУБИКА ═══════════
      - name: Recolor Pacman to blueberry
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          def brightness(h):
              h = h.lstrip('#')
              r, g, b = int(h[0:2], 16), int(h[2:4], 16), int(h[4:6], 16)
              return r * 0.299 + g * 0.587 + b * 0.114

          def to_blueberry(hex_color):
              h = hex_color.lstrip('#').lower()
              if h in ('ffffff', 'fefefe', 'fdfdfd', 'f0f0f0'):
                  return '#' + h
              b = brightness(h)
              if b < 15:  return '#05070f'
              if b < 60:  return '#0a1122'
              if b < 110: return '#1a1a4e'
              if b < 160: return '#3b3b98'
              if b < 210: return '#6666cc'
              return '#8a8aff'

          for svg in Path('dist').glob('pacman*.svg'):
              content = svg.read_text()
              colors = set(re.findall(r'#[0-9a-fA-F]{6}', content))
              for c in colors:
                  content = content.replace(c, to_blueberry(c))
              svg.write_text(content)
              print(f'✅ Blueberry: {svg.name}')
          EOF

      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
