name: Generate Arcade Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */24 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "aggressive"
          hide_month_labels: "true"

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/arcade-snake.svg?color_snake=#00d4ff&color_dots=#05070f,#0a2940,#006b9c,#00aee8,#a0f0ff
            dist/arcade-snake-dark.svg?palette=github-dark&color_snake=#00d4ff&color_dots=#05070f,#0a2940,#006b9c,#00aee8,#a0f0ff

      - name: Publish
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
