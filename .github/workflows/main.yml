name: generate arcade graphs

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare dist
        run: mkdir -p dist

      # ═══════════════════════════════════════════════
      #  ЗМЕЙКА v8 — новый файл neon-snake.svg
      # ═══════════════════════════════════════════════
      - name: Generate neon snake
        run: |
          python3 - << 'PYEOF'
          import random

          # ═══════════════════════════════════════════
          #  НАСТРОЙКИ
          # ═══════════════════════════════════════════
          COLS, ROWS = 53, 7       # размер сетки
          CELL, GAP  = 11, 2       # размер клетки / отступ
          SNAKE_LEN  = 8           # сегментов у змейки
          NUM_DOTS   = 20          # сколько грибов на поле
          SPEED      = 0.10        # сек на 1 клетку
          INVIS_SEC  = 30.0        # сколько гриб невидим после съедания

          BG     = "#05070f"
          CELLBG = "#0a1122"
          MCAP   = "#00d4ff"
          MSTEM  = "#66e6ff"
          MDOT   = "#ffffff"
          SNAKE  = "#00d4ff"
          HEAD   = "#a0f0ff"

          W = COLS * (CELL + GAP)
          H = ROWS * (CELL + GAP)

          # ═══════════════════════════════════════════
          #  ПУТЬ: BOUSTROPHEDON — все клетки поля
          #  строка 0: слева → направо
          #  строка 1: справа → налево
          #  строка 2: слева → направо ... и т.д.
          # ═══════════════════════════════════════════
          path = []
          for row in range(ROWS):
              if row % 2 == 0:
                  for c in range(COLS):
                      path.append((c, row))
              else:
                  for c in range(COLS - 1, -1, -1):
                      path.append((c, row))

          L = len(path)
          DUR = L * SPEED
          INVIS_FRAC = INVIS_SEC / DUR

          # ═══════════════════════════════════════════
          #  20 ГРИБОВ В ЛЮБОЙ КЛЕТКЕ ПОЛЯ
          # ═══════════════════════════════════════════
          random.seed()
          dots = set()
          while len(dots) < NUM_DOTS:
              dots.add((random.randint(0, COLS - 1),
                        random.randint(0, ROWS - 1)))

          def xy(c, r):
              return c * (CELL + GAP) + CELL / 2, r * (CELL + GAP) + CELL / 2

          path_str = " ".join(
              f'{"M" if i == 0 else "L"} {xy(c, r)[0]:.1f} {xy(c, r)[1]:.1f}'
              for i, (c, r) in enumerate(path)
          )

          # ═══════════════════════════════════════════
          #  СБОРКА SVG
          # ═══════════════════════════════════════════
          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
              '<defs>',
              '<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">',
              '<feGaussianBlur stdDeviation="2.5" result="b"/>',
              '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>',
              '</filter>',
              '<g id="mushroom">',
              f'<path d="M -4.5,1 A 4.5,4 0 0 1 4.5,1 Z" fill="{MCAP}"/>',
              f'<circle cx="-2.2" cy="-1.5" r="0.8" fill="{MDOT}"/>',
              f'<circle cx="2.2" cy="-1.5" r="0.8" fill="{MDOT}"/>',
              f'<circle cx="0" cy="-2.8" r="0.6" fill="{MDOT}"/>',
              f'<rect x="-1.8" y="1" width="3.6" height="3" rx="0.5" fill="{MSTEM}"/>',
              '</g>',
              '</defs>',
              f'<rect width="{W}" height="{H}" fill="{BG}"/>',
          ]

          # сетка
          for col in range(COLS):
              for row in range(ROWS):
                  x = col * (CELL + GAP)
                  y = row * (CELL + GAP)
                  parts.append(
                      f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" '
                      f'rx="2" fill="{CELLBG}" stroke="#0a2a4d" stroke-width="0.5"/>'
                  )

          # ═══════════════════════════════════════════
          #  ГРИБЫ с анимацией видимости
          # ═══════════════════════════════════════════
          cell_time = {cell: i / L for i, cell in enumerate(path)}
          lead = (SNAKE_LEN - 1) / L

          for (col, row) in dots:
              cx, cy = xy(col, row)

              if (col, row) in cell_time:
                  t_tail = cell_time[(col, row)]
                  t_head = t_tail - lead
                  if t_head < 0:
                      t_head += 1.0
              else:
                  t_head = 0.5

              t_start = t_head
              t_end = t_start + INVIS_FRAC

              if t_end <= 1.0:
                  keyTimes = f"0;{t_start:.4f};{t_start:.4f};{t_end:.4f};1"
                  values   = "1;1;0;1;1"
              else:
                  t_wrap   = t_end - 1.0
                  keyTimes = f"0;{t_wrap:.4f};{t_wrap:.4f};{t_start:.4f};{t_start:.4f};1"
                  values   = "0;0;1;1;0;0"

              parts.append(f'<g transform="translate({cx:.1f},{cy:.1f})" filter="url(#glow)">')
              parts.append('<use href="#mushroom"/>')
              parts.append(
                  f'<animate attributeName="opacity" '
                  f'values="{values}" keyTimes="{keyTimes}" '
                  f'dur="{DUR:.2f}s" repeatCount="indefinite"/>'
              )
              parts.append('</g>')

          # ═══════════════════════════════════════════
          #  ЗМЕЙКА — голова впереди
          # ═══════════════════════════════════════════
          for i in range(SNAKE_LEN):
              begin = -(SNAKE_LEN - 1 - i) * SPEED
              r = CELL / 2 - 0.5 if i == 0 else CELL / 2 - 2
              color = HEAD if i == 0 else SNAKE
              opacity = 1 if i == 0 else max(0.35, 1 - i * 0.08)
              parts.append(
                  f'<circle r="{r}" fill="{color}" opacity="{opacity}" filter="url(#glow)">'
                  f'<animateMotion dur="{DUR:.2f}s" repeatCount="indefinite" '
                  f'begin="{begin:.3f}s" path="{path_str}"/>'
                  f'</circle>'
              )

          parts.append('</svg>')

          # ═══════════════════════════════════════════
          #  СОХРАНЯЕМ В НОВЫЙ ФАЙЛ (обход кеша)
          # ═══════════════════════════════════════════
          with open('dist/neon-snake.svg', 'w') as f:
              f.write('\n'.join(parts))
          print(f'✅ Neon snake v8 — cells={L}, dur={DUR:.1f}s, invis={INVIS_SEC}s')
          PYEOF

      # ═══ ПАКМАН → ГОЛУБИКА ═══
      - name: Recolor Pacman to blueberry
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          # ═══════════════════════════════════════════════
          #  КАРТА ЗАМЕНЫ ЦВЕТОВ → ГОЛУБИКА
          #  Логика: каждый исходный цвет → оттенок голубики
          # ═══════════════════════════════════════════════

          DARK_MAP = {
              # фон и сетка → тёмный фиолет (фон голубичной поляны)
              '#0d1117': '#05070f',
              '#161b22': '#1a0a3d',
              # точки, которые ест Пакман → яркая спелая голубика
              '#ffffff': '#c07aff',
              # линии лабиринта → средний фиолет
              '#8b949e': '#6b2fa0',
              # активные вклады (зелёные) → сочная голубика
              '#39d353': '#9c4de0',
              '#26a641': '#7a35c0',
          }

          LIGHT_MAP = {
              '#ffffff': '#f5eeff',   # фон → очень светлый лавандовый
              '#ebedf0': '#e0d5f5',   # сетка → светлый фиолет
              '#000000': '#5c1f9e',   # точки → тёмно-фиолетовый
              '#57606a': '#7a35c0',   # линии → средний фиолет
              '#216e39': '#9c4de0',   # вклады → голубика
              '#30a14e': '#7a35c0',
              '#808080': '#8a8aff',
          }

          for svg in Path('dist').glob('pacman*.svg'):
              txt = svg.read_text()
              is_dark = '-dark' in svg.name
              cmap = DARK_MAP if is_dark else LIGHT_MAP

              replaced = 0
              for old, new in cmap.items():
                  # Регистронезависимая замена hex
                  pattern = re.compile(re.escape(old), re.IGNORECASE)
                  count = len(pattern.findall(txt))
                  if count > 0:
                      txt = pattern.sub(new, txt)
                      replaced += count
                      print(f'  {old} → {new}  ({count} шт.)')

              svg.write_text(txt)
              print(f'✅ {svg.name}: заменено {replaced} цветов\n')
          EOF
      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
