name: generate arcade graphs

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  generate:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 20


    steps:


      # ================================
      # PACMAN GENERATION
      # ================================

      - name: Generate Pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}


      # ================================
      # PYTHON
      # ================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"



      # ================================
      # BLUEBERRY PACMAN COLORS
      # ================================

      - name: Turn dots into blueberries

        run: |

          python3 <<'PY'

          from pathlib import Path
          import re


          colors = {

              # dark background
              "#0d1117": "#05070f",
              "#161b22": "#12091f",

              # green contributions
              "#39d353": "#39d9ff",
              "#26a641": "#19a8d8",
              "#006d32": "#117ba3",
              "#0e4429": "#07506d",

              # white dots
              "#ffffff": "#c7f7ff",

              # borders
              "#8b949e": "#2d86aa"
          }


          for file in Path("dist").glob("*.svg"):

              text = file.read_text(
                  encoding="utf-8"
              )


              for old,new in colors.items():

                  text = re.sub(
                      old,
                      new,
                      text,
                      flags=re.IGNORECASE
                  )


              file.write_text(
                  text,
                  encoding="utf-8"
              )


              print(
                  "Updated:",
                  file
              )


          PY



      # ================================
      # NEON SNAKE
      # ================================

      - name: Generate neon snake

        run: |

          mkdir -p dist


          python3 <<'PY'

          import random


          COLS = 53
          ROWS = 7

          CELL = 12
          GAP = 2


          WIDTH = COLS*(CELL+GAP)
          HEIGHT = ROWS*(CELL+GAP)


          random.seed()


          def pos(x,y):

              return (
                  x*(CELL+GAP)+CELL/2,
                  y*(CELL+GAP)+CELL/2
              )



          # random snake route

          route=[]

          x=random.randint(0,COLS-1)
          y=random.randint(0,ROWS-1)


          visited=set()


          while len(route)<COLS*ROWS:

              if (
                  0<=x<COLS
                  and
                  0<=y<ROWS
                  and
                  (x,y) not in visited
              ):

                  route.append((x,y))
                  visited.add((x,y))


              dx,dy=random.choice([
                  (1,0),
                  (-1,0),
                  (0,1),
                  (0,-1)
              ])

              x+=dx
              y+=dy


              if not (
                  0<=x<COLS
                  and
                  0<=y<ROWS
              ):

                  x,y=random.choice(route)



          path=""


          for i,(x,y) in enumerate(route):

              X,Y=pos(x,y)

              path += (
                  ("M" if i==0 else "L")
                  +
                  f"{X},{Y} "
              )



          svg=f"""

          <svg xmlns="http://www.w3.org/2000/svg"
          width="{WIDTH}"
          height="{HEIGHT}">


          <rect width="100%"
          height="100%"
          fill="#05070f"/>


          <defs>

          <filter id="glow">

          <feGaussianBlur
          stdDeviation="3"/>

          </filter>

          </defs>


          """


          # mushrooms

          for i in range(8):

              x,y=random.choice(route)

              X,Y=pos(x,y)

              svg+=f"""

              <circle
              cx="{X}"
              cy="{Y}"
              r="4"
              fill="#00d4ff"/>

              """



          # snake

          for i in range(8):

              svg+=f"""

              <circle
              r="{5-i*0.35}"
              fill="#00d4ff"
              opacity="{1-i*0.08}">

              <animateMotion
              dur="70s"
              repeatCount="indefinite"
              begin="-{i}s"
              path="{path}"/>

              </circle>

              """



          svg+="</svg>"


          open(
              "dist/neon-snake.svg",
              "w"
          ).write(svg)


          print(
              "Snake generated"
          )

          PY



      # ================================
      # PUBLISH
      # ================================


      - name: Push SVG files

        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:

          target_branch: output

          build_dir: dist


        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
