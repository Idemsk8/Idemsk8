name: generate arcade graphs

on:
  schedule:
    - cron: "17 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate arcade animations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ============================================================
      # PACMAN
      # ============================================================

      - name: Generate Pacman contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare dist
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist

      # ============================================================
      # PACMAN → BLUEBERRY
      # ============================================================

      - name: Recolor Pacman to blueberry
        shell: python
        run: |
          from pathlib import Path
          import re

          # --------------------------------------------------------
          # Цветовая палитра
          # --------------------------------------------------------

          DARK_MAP = {
              "#0d1117": "#05070f",
              "#161b22": "#12091f",

              # contribution dots → blueberry
              "#39d353": "#39c6ff",
              "#26a641": "#209bd1",
              "#006d32": "#147ca8",
              "#0e4429": "#0b5575",

              # classic white dots
              "#ffffff": "#8fe8ff",

              # maze / borders
              "#8b949e": "#347fa3",
          }

          LIGHT_MAP = {
              "#ffffff": "#f4fbff",
              "#ebedf0": "#d8f5ff",

              # contribution dots → blueberry
              "#39d353": "#39c6ff",
              "#26a641": "#209bd1",
              "#216e39": "#147ca8",
              "#30a14e": "#209bd1",

              "#000000": "#075477",
              "#57606a": "#347fa3",
              "#808080": "#5dbbdd",
          }

          for svg in Path(".").rglob("pacman*.svg"):

              text = svg.read_text(encoding="utf-8")

              color_map = (
                  DARK_MAP
                  if "-dark" in svg.name.lower()
                  else LIGHT_MAP
              )

              replacements = 0

              for old, new in color_map.items():

                  pattern = re.compile(
                      re.escape(old),
                      re.IGNORECASE
                  )

                  text, count = pattern.subn(new, text)

                  replacements += count

              svg.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  f"✓ {svg}: "
                  f"{replacements} color replacements"
              )

      # ============================================================
      # NEON SNAKE
      # ============================================================

      - name: Generate neon snake with mushrooms
        shell: python
        run: |
          from __future__ import annotations

          import random
          from pathlib import Path

          # ========================================================
          # SETTINGS
          # ========================================================

          COLS = 53
          ROWS = 7

          CELL = 11
          GAP = 2

          SNAKE_LENGTH = 9
          MUSHROOMS = 8

          # Seconds per cell.
          SPEED = 0.105

          # How long a mushroom stays hidden
          # after being eaten.
          RESPAWN_MIN = 1.5
          RESPAWN_MAX = 5.0

          # Random seed is intentionally not fixed.
          # Every workflow generation gets a new route.
          random.seed()

          # ========================================================
          # COLORS
          # ========================================================

          BG = "#05070f"
          CELL_BG = "#081321"
          GRID = "#0b2942"

          NEON = "#00d4ff"
          NEON_LIGHT = "#a8f3ff"
          NEON_DARK = "#008bb8"

          BLUEBERRY = "#5edcff"
          BLUEBERRY_LIGHT = "#d5f8ff"

          MUSHROOM_CAP = "#00bfff"
          MUSHROOM_CAP_LIGHT = "#a6efff"
          MUSHROOM_STEM = "#d8fbff"

          # ========================================================
          # DIMENSIONS
          # ========================================================

          WIDTH = COLS * (CELL + GAP)
          HEIGHT = ROWS * (CELL + GAP)

          # ========================================================
          # HELPERS
          # ========================================================

          def xy(col: int, row: int):
              return (
                  col * (CELL + GAP) + CELL / 2,
                  row * (CELL + GAP) + CELL / 2
              )

          def neighbours(cell):
              col, row = cell

              result = []

              directions = [
                  (1, 0),
                  (-1, 0),
                  (0, 1),
                  (0, -1),
              ]

              for dc, dr in directions:

                  nc = col + dc
                  nr = row + dr

                  if (
                      0 <= nc < COLS
                      and 0 <= nr < ROWS
                  ):
                      result.append((nc, nr))

              return result

          # ========================================================
          # RANDOM FULL-FIELD ROUTE
          #
          # The old version used a fixed:
          #
          # left → right
          # right → left
          #
          # route.
          #
          # This version creates a random Hamiltonian-like walk
          # through the entire grid.
          # ========================================================

          def generate_route():

              total = COLS * ROWS

              start = (
                  random.randrange(COLS),
                  random.randrange(ROWS)
              )

              route = [start]
              visited = {start}

              while len(route) < total:

                  current = route[-1]

                  candidates = [
                      cell
                      for cell in neighbours(current)
                      if cell not in visited
                  ]

                  if not candidates:
                      # Restart if we hit a dead end.
                      return generate_route()

                  # Prefer cells with fewer available exits.
                  # This produces more turns and less predictable
                  # movement than choosing a purely random cell.
                  candidates.sort(
                      key=lambda cell: (
                          len([
                              n
                              for n in neighbours(cell)
                              if n not in visited
                          ]),
                          random.random()
                      )
                  )

                  # Usually take one of the best candidates,
                  # but occasionally select another one to make
                  # the animation less deterministic.
                  best_count = min(3, len(candidates))

                  next_cell = random.choice(
                      candidates[:best_count]
                  )

                  route.append(next_cell)
                  visited.add(next_cell)

              return route

          # ========================================================
          # ROUTE
          # ========================================================

          route = generate_route()

          route_length = len(route)

          duration = route_length * SPEED

          # ========================================================
          # SVG PATH
          # ========================================================

          path_commands = []

          for index, cell in enumerate(route):

              x, y = xy(*cell)

              command = "M" if index == 0 else "L"

              path_commands.append(
                  f"{command} {x:.2f} {y:.2f}"
              )

          path = " ".join(path_commands)

          # ========================================================
          # MUSHROOM PLACEMENT
          #
          # Mushrooms are placed on random cells.
          # They are never initially placed directly under the
          # snake head.
          # ========================================================

          snake_start = set(route[:SNAKE_LENGTH + 2])

          available_cells = [
              cell
              for cell in route
              if cell not in snake_start
          ]

          random.shuffle(available_cells)

          mushroom_cells = available_cells[:MUSHROOMS]

          # ========================================================
          # SVG
          # ========================================================

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{WIDTH}" height="{HEIGHT}" '
              f'viewBox="0 0 {WIDTH} {HEIGHT}" '
              f'role="img" aria-label="Neon snake eating mushrooms">'
          )

          # ========================================================
          # DEFINITIONS
          # ========================================================

          svg.append("<defs>")

          # --------------------------------------------------------
          # Glow
          # --------------------------------------------------------

          svg.append("""
          <filter id="glow"
                  x="-100%"
                  y="-100%"
                  width="300%"
                  height="300%">
            <feGaussianBlur
              stdDeviation="2.2"
              result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          """)

          # Stronger glow for mushrooms.

          svg.append("""
          <filter id="mushroomGlow"
                  x="-200%"
                  y="-200%"
                  width="400%"
                  height="400%">
            <feGaussianBlur
              stdDeviation="2.8"
              result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          """)

          # --------------------------------------------------------
          # Mushroom
          # --------------------------------------------------------

          svg.append(f"""
          <g id="mushroom">

            <path
              d="M -4.8 0
                 C -4.5 -3.8,
                   -2.2 -5.2,
                    0 -5.2
                 C 2.2 -5.2,
                   4.5 -3.8,
                   4.8 0
                 Z"
              fill="{MUSHROOM_CAP}"
            />

            <circle
              cx="-2.1"
              cy="-2.3"
              r="0.8"
              fill="{MUSHROOM_CAP_LIGHT}"
            />

            <circle
              cx="2.0"
              cy="-2.0"
              r="0.75"
              fill="{MUSHROOM_CAP_LIGHT}"
            />

            <circle
              cx="0"
              cy="-3.8"
              r="0.55"
              fill="{MUSHROOM_CAP_LIGHT}"
            />

            <rect
              x="-1.8"
              y="0"
              width="3.6"
              height="4"
              rx="0.8"
              fill="{MUSHROOM_STEM}"
            />

          </g>
          """)

          # --------------------------------------------------------
          # Snake head
          # --------------------------------------------------------

          svg.append("""
          <g id="snakeHead">

            <circle
              cx="0"
              cy="0"
              r="4.7"
              fill="#a8f3ff"
            />

            <circle
              cx="-1.6"
              cy="-1.4"
              r="0.65"
              fill="#05070f"
            />

            <circle
              cx="1.6"
              cy="-1.4"
              r="0.65"
              fill="#05070f"
            />

          </g>
          """)

          svg.append("</defs>")

          # ========================================================
          # BACKGROUND
          # ========================================================

          svg.append(
              f'<rect width="{WIDTH}" '
              f'height="{HEIGHT}" '
              f'fill="{BG}"/>'
          )

          # ========================================================
          # GRID
          # ========================================================

          for col in range(COLS):

              for row in range(ROWS):

                  x = col * (CELL + GAP)
                  y = row * (CELL + GAP)

                  svg.append(
                      f'<rect '
                      f'x="{x}" '
                      f'y="{y}" '
                      f'width="{CELL}" '
                      f'height="{CELL}" '
                      f'rx="2" '
                      f'fill="{CELL_BG}" '
                      f'stroke="{GRID}" '
                      f'stroke-width="0.5"/>'
                  )

          # ========================================================
          # MUSHROOM ANIMATION
          #
          # The mushroom disappears when the snake reaches its
          # corresponding position on the route.
          #
          # Then it respawns later at the same location.
          # ========================================================

          route_index = {
              cell: index
              for index, cell in enumerate(route)
          }

          for mushroom in mushroom_cells:

              x, y = xy(*mushroom)

              index = route_index[mushroom]

              # Time when snake head reaches mushroom.
              eat_time = index * SPEED

              respawn_delay = random.uniform(
                  RESPAWN_MIN,
                  RESPAWN_MAX
              )

              respawn_time = eat_time + respawn_delay

              # SVG animation values.
              key_times = [
                  "0",
                  f"{eat_time / duration:.6f}",
                  f"{eat_time / duration:.6f}",
                  f"{respawn_time / duration:.6f}",
                  f"{respawn_time / duration:.6f}",
                  "1"
              ]

              values = [
                  "1",
                  "1",
                  "0",
                  "0",
                  "1",
                  "1"
              ]

              svg.append(
                  f'<g '
                  f'transform="translate({x:.2f},{y:.2f})" '
                  f'filter="url(#mushroomGlow)">'
              )

              svg.append(
                  '<use href="#mushroom"/>'
              )

              svg.append(
                  f'<animate '
                  f'attributeName="opacity" '
                  f'values="{";".join(values)}" '
                  f'keyTimes="{";".join(key_times)}" '
                  f'dur="{duration:.2f}s" '
                  f'repeatCount="indefinite"/>'
              )

              svg.append("</g>")

          # ========================================================
          # SNAKE BODY
          # ========================================================

          for segment in range(SNAKE_LENGTH):

              # The head is segment 0.
              delay = segment * SPEED

              radius = (
                  4.6
                  if segment == 0
                  else max(
                      2.2,
                      4.2 - segment * 0.28
                  )
              )

              opacity = (
                  1
                  if segment == 0
                  else max(
                      0.32,
                      1 - segment * 0.075
                  )
              )

              color = (
                  NEON_LIGHT
                  if segment == 0
                  else NEON
              )

              svg.append(
                  f'<circle '
                  f'r="{radius:.2f}" '
                  f'fill="{color}" '
                  f'opacity="{opacity:.3f}" '
                  f'filter="url(#glow)">'
              )

              svg.append(
                  f'<animateMotion '
                  f'dur="{duration:.2f}s" '
                  f'begin="-{delay:.3f}s" '
                  f'repeatCount="indefinite" '
                  f'path="{path}" '
                  f'rotate="auto"/>'
              )

              svg.append("</circle>")

          # ========================================================
          # HEAD
          # ========================================================

          svg.append(
              '<use href="#snakeHead" '
              'filter="url(#glow)">'
          )

          svg.append(
              f'<animateMotion '
              f'dur="{duration:.2f}s" '
              f'repeatCount="indefinite" '
              f'path="{path}" '
              f'rotate="auto"/>'
          )

          svg.append("</use>")

          # ========================================================
          # END
          # ========================================================

          svg.append("</svg>")

          output = Path("dist/neon-snake.svg")

          output.write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          print("======================================")
          print("✓ NEON SNAKE GENERATED")
          print(f"✓ Grid: {COLS} x {ROWS}")
          print(f"✓ Cells: {route_length}")
          print(f"✓ Snake length: {SNAKE_LENGTH}")
          print(f"✓ Mushrooms: {MUSHROOMS}")
          print(f"✓ Duration: {duration:.2f}s")
          print(f"✓ Output: {output}")
          print("======================================")

      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🎮 Update arcade animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
