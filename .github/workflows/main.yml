name: generate arcade graphs

on:
  schedule:
    - cron: "17 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    name: Generate Pacman and Neon Snake

    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ============================================================
      # PACMAN
      # ============================================================

      - name: Generate Pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # PREPARE DIST
      # ============================================================

      - name: Prepare dist
        shell: bash
        run: |
          mkdir -p dist
          echo "Files generated by Pacman:"
          find dist -maxdepth 1 -type f -print || true


      # ============================================================
      # BLUEBERRY PACMAN
      #
      # We keep the real Pacman animation and real contribution data.
      # Only its visual palette is modified.
      # ============================================================

      - name: Apply blueberry neon theme to Pacman
        shell: python
        run: |
          from pathlib import Path
          import re

          DIST = Path("dist")

          # --------------------------------------------------------
          # YOUR PALETTE
          # --------------------------------------------------------

          BACKGROUND = "#05070f"
          BACKGROUND_2 = "#081321"

          BLUEBERRY_1 = "#00d4ff"
          BLUEBERRY_2 = "#39c6ff"
          BLUEBERRY_3 = "#7b61ff"
          BLUEBERRY_4 = "#a855f7"

          GRID = "#0a2a4d"
          GRID_LIGHT = "#123b5c"

          PACMAN = "#a0f0ff"

          # --------------------------------------------------------
          # GitHub light/dark colors -> YOUR colors
          # --------------------------------------------------------

          replacements = {
              # backgrounds
              "#ffffff": BACKGROUND,
              "#fff": BACKGROUND,

              "#0d1117": BACKGROUND,
              "#161b22": BACKGROUND_2,

              "#f6f8fa": BACKGROUND,
              "#f0f6fc": BACKGROUND,

              "#ebedf0": GRID,
              "#e1e4e8": GRID,

              # contribution levels
              "#0e4429": "#073b52",
              "#006d32": "#075b7d",
              "#26a641": BLUEBERRY_3,
              "#39d353": BLUEBERRY_1,

              # other GitHub greens
              "#216e39": "#075b7d",
              "#30a14e": BLUEBERRY_3,

              # gray maze / outlines
              "#8b949e": GRID_LIGHT,
              "#57606a": GRID_LIGHT,
              "#6e7781": GRID_LIGHT,

              # common dark text
              "#24292f": "#cfefff",
              "#000000": "#05070f",

              # white contribution dots
              "#ffffff": BACKGROUND,

              # Pacman yellow
              "#f2cc60": PACMAN,
              "#f0c419": PACMAN,
              "#ffcc00": PACMAN,
              "#ffff00": PACMAN,
          }

          files = list(DIST.glob("pacman*.svg"))

          if not files:
              raise SystemExit(
                  "ERROR: Pacman SVG files were not found in dist/"
              )

          print("Pacman files found:")

          for file in files:
              print("  ", file.name)

              text = file.read_text(encoding="utf-8")

              for old, new in replacements.items():
                  text = re.sub(
                      re.escape(old),
                      new,
                      text,
                      flags=re.IGNORECASE
                  )

              # ----------------------------------------------------
              # Force dark background even if the generator changes
              # its internal palette.
              # ----------------------------------------------------

              text = re.sub(
                  r'(<svg\b[^>]*>)',
                  r'\1'
                  f'<rect width="100%" height="100%" fill="{BACKGROUND}"/>',
                  text,
                  count=1,
                  flags=re.IGNORECASE
              )

              # ----------------------------------------------------
              # Add a subtle neon-blue background glow.
              # ----------------------------------------------------

              if "<defs>" in text:
                  text = text.replace(
                      "<defs>",
                      f"""
                      <defs>
                      <radialGradient id="blueberryBackground"
                                      cx="50%" cy="50%" r="70%">
                        <stop offset="0%" stop-color="#071a2d"/>
                        <stop offset="55%" stop-color="#05070f"/>
                        <stop offset="100%" stop-color="#03050b"/>
                      </radialGradient>
                      """,
                      1
                  )

              file.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  f"✓ {file.name}: blueberry neon theme applied"
              )


      # ============================================================
      # NEON SNAKE
      #
      # Full-field movement.
      # Valid adjacent-cell route.
      # Randomized direction.
      # Mushrooms disappear when eaten.
      # Mushrooms respawn later.
      # ============================================================

      - name: Generate neon snake
        shell: python
        run: |

          cat > /tmp/generate_snake.py <<'PY'

          from pathlib import Path
          import random


          # ========================================================
          # SETTINGS
          # ========================================================

          COLS = 53
          ROWS = 7

          CELL = 11
          GAP = 2

          SNAKE_LENGTH = 9
          MUSHROOM_COUNT = 9

          SPEED = 0.115

          BG = "#05070f"
          CELL_BG = "#081321"
          GRID = "#0a2a4d"

          NEON = "#00d4ff"
          NEON_LIGHT = "#a0f0ff"
          NEON_DARK = "#008fba"

          BLUEBERRY = "#39c6ff"
          BLUEBERRY_LIGHT = "#c8f7ff"

          MUSHROOM_CAP = "#7b61ff"
          MUSHROOM_CAP_LIGHT = "#b8a7ff"
          MUSHROOM_STEM = "#d8fbff"


          WIDTH = COLS * (CELL + GAP)
          HEIGHT = ROWS * (CELL + GAP)


          # ========================================================
          # POSITION
          # ========================================================

          def xy(cell):

              x, y = cell

              return (
                  x * (CELL + GAP) + CELL / 2,
                  y * (CELL + GAP) + CELL / 2
              )


          # ========================================================
          # NEIGHBOURS
          # ========================================================

          def neighbours(cell):

              x, y = cell

              result = []

              for dx, dy in (
                  (1, 0),
                  (-1, 0),
                  (0, 1),
                  (0, -1),
              ):

                  nx = x + dx
                  ny = y + dy

                  if (
                      0 <= nx < COLS
                      and
                      0 <= ny < ROWS
                  ):

                      result.append((nx, ny))

              return result


          # ========================================================
          # RANDOM HAMILTONIAN-LIKE ROUTE
          #
          # We start with a valid complete grid route and then
          # randomly mirror / rotate its direction.
          #
          # Every two consecutive cells are ALWAYS adjacent.
          # ========================================================

          def make_route():

              # Randomly choose horizontal or vertical orientation.
              horizontal = random.choice([True, False])

              route = []

              if horizontal:

                  # Random direction.
                  reverse = random.choice([False, True])

                  for row in range(ROWS):

                      if (row % 2 == 0) ^ reverse:

                          columns = range(COLS)

                      else:

                          columns = range(
                              COLS - 1,
                              -1,
                              -1
                          )

                      for col in columns:
                          route.append((col, row))

              else:

                  reverse = random.choice([False, True])

                  for col in range(COLS):

                      if (col % 2 == 0) ^ reverse:

                          rows = range(ROWS)

                      else:

                          rows = range(
                              ROWS - 1,
                              -1,
                              -1
                          )

                      for row in rows:
                          route.append((col, row))


              # Randomly rotate the route so the starting point
              # changes every generation.

              shift = random.randrange(len(route))

              route = (
                  route[shift:]
                  +
                  route[:shift]
              )


              # Randomly reverse the whole route.

              if random.choice([True, False]):

                  route.reverse()


              return route


          route = make_route()


          # ========================================================
          # SVG PATH
          # ========================================================

          commands = []

          for index, cell in enumerate(route):

              x, y = xy(cell)

              commands.append(
                  ("M" if index == 0 else "L")
                  +
                  f" {x:.2f} {y:.2f}"
              )


          path = " ".join(commands)


          DURATION = len(route) * SPEED


          # ========================================================
          # MUSHROOMS
          # ========================================================

          random.seed()

          forbidden = set(
              route[:SNAKE_LENGTH + 5]
          )

          available = [
              cell
              for cell in route
              if cell not in forbidden
          ]

          mushroom_cells = random.sample(
              available,
              min(
                  MUSHROOM_COUNT,
                  len(available)
              )
          )


          # ========================================================
          # SVG START
          # ========================================================

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{WIDTH}" height="{HEIGHT}" '
              f'viewBox="0 0 {WIDTH} {HEIGHT}" '
              f'preserveAspectRatio="xMidYMid meet">'
          )


          # ========================================================
          # DEFS
          # ========================================================

          svg.append(f"""
          <defs>

            <radialGradient id="backgroundGlow">
              <stop offset="0%" stop-color="#071a2d"/>
              <stop offset="65%" stop-color="#05070f"/>
              <stop offset="100%" stop-color="#03050b"/>
            </radialGradient>


            <filter id="neonGlow"
                    x="-100%"
                    y="-100%"
                    width="300%"
                    height="300%">

              <feGaussianBlur
                stdDeviation="2.2"
                result="blur"/>

              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>

            </filter>


            <filter id="strongGlow"
                    x="-200%"
                    y="-200%"
                    width="400%"
                    height="400%">

              <feGaussianBlur
                stdDeviation="3"
                result="blur"/>

              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>

            </filter>


            <!-- ================================================
                 BLUEBERRY
                 ================================================ -->

            <g id="blueberry">

              <circle
                cx="0"
                cy="0"
                r="3.6"
                fill="{BLUEBERRY}"
                stroke="{BLUEBERRY_LIGHT}"
                stroke-width="0.45"/>

              <circle
                cx="-1.1"
                cy="-1.2"
                r="0.75"
                fill="#ffffff"
                opacity="0.9"/>

              <path
                d="M -1.5,-3.0
                   Q 0,-4.5
                   1.5,-3.0"
                fill="none"
                stroke="{BLUEBERRY_LIGHT}"
                stroke-width="0.7"/>

            </g>


            <!-- ================================================
                 MUSHROOM
                 ================================================ -->

            <g id="mushroom">

              <path
                d="M -4.6,0
                   C -4.3,-3.7
                     -2.2,-5.0
                      0,-5.0
                   C 2.2,-5.0
                     4.3,-3.7
                     4.6,0
                   Z"
                fill="{MUSHROOM_CAP}"/>

              <circle
                cx="-2"
                cy="-2.2"
                r="0.75"
                fill="{MUSHROOM_CAP_LIGHT}"/>

              <circle
                cx="2"
                cy="-2"
                r="0.75"
                fill="{MUSHROOM_CAP_LIGHT}"/>

              <circle
                cx="0"
                cy="-3.7"
                r="0.55"
                fill="{MUSHROOM_CAP_LIGHT}"/>

              <rect
                x="-1.7"
                y="0"
                width="3.4"
                height="4"
                rx="0.8"
                fill="{MUSHROOM_STEM}"/>

            </g>


            <!-- ================================================
                 SNAKE HEAD
                 ================================================ -->

            <g id="snakeHead">

              <circle
                r="4.5"
                fill="{NEON_LIGHT}"/>

              <circle
                cx="-1.5"
                cy="-1.4"
                r="0.65"
                fill="#05070f"/>

              <circle
                cx="1.5"
                cy="-1.4"
                r="0.65"
                fill="#05070f"/>

            </g>

          </defs>
          """)


          # ========================================================
          # BACKGROUND
          # ========================================================

          svg.append(
              f'<rect width="{WIDTH}" '
              f'height="{HEIGHT}" '
              f'fill="url(#backgroundGlow)"/>'
          )


          # ========================================================
          # GRID
          # ========================================================

          for row in range(ROWS):

              for col in range(COLS):

                  x = col * (CELL + GAP)
                  y = row * (CELL + GAP)

                  svg.append(
                      f'<rect '
                      f'x="{x}" '
                      f'y="{y}" '
                      f'width="{CELL}" '
                      f'height="{CELL}" '
                      f'rx="2" '
                      f'fill="{CELL_BG}" '
                      f'stroke="{GRID}" '
                      f'stroke-width="0.45"/>'
                  )


          # ========================================================
          # MUSHROOMS
          #
          # Every mushroom has its own timing.
          # The mushroom disappears when the snake reaches it.
          # ========================================================

          route_index = {
              cell: index
              for index, cell in enumerate(route)
          }


          for mushroom in mushroom_cells:

              x, y = xy(mushroom)

              index = route_index[mushroom]

              eat_time = index * SPEED

              respawn = random.uniform(
                  2.0,
                  5.0
              )

              # Convert times into the animation cycle.
              eat = (
                  eat_time % DURATION
              ) / DURATION

              back = (
                  (eat_time + respawn) % DURATION
              ) / DURATION


              # Normal case.
              if back > eat:

                  values = "1;1;0;0;1"

                  key_times = (
                      f"0;"
                      f"{eat:.6f};"
                      f"{eat:.6f};"
                      f"{back:.6f};"
                      f"{back:.6f}"
                  )

              # Wrap-around case.
              else:

                  values = "0;1;1;0;0;1"

                  key_times = (
                      f"0;"
                      f"{back:.6f};"
                      f"{back:.6f};"
                      f"{eat:.6f};"
                      f"{eat:.6f};"
                      f"1"
                  )


              svg.append(
                  f'<g '
                  f'transform="translate({x:.2f},{y:.2f})" '
                  f'filter="url(#strongGlow)">'
              )

              svg.append(
                  '<use href="#mushroom"/>'
              )

              svg.append(
                  f'<animate '
                  f'attributeName="opacity" '
                  f'values="{values}" '
                  f'keyTimes="{key_times}" '
                  f'dur="{DURATION:.2f}s" '
                  f'repeatCount="indefinite"/>'
              )

              svg.append("</g>")


          # ========================================================
          # SNAKE BODY
          # ========================================================

          for segment in range(SNAKE_LENGTH):

              delay = segment * SPEED

              radius = max(
                  2.25,
                  4.1 - segment * 0.27
              )

              opacity = max(
                  0.35,
                  1.0 - segment * 0.075
              )


              svg.append(
                  f'<circle '
                  f'r="{radius:.2f}" '
                  f'fill="{NEON}" '
                  f'opacity="{opacity:.3f}" '
                  f'filter="url(#neonGlow)">'
              )


              svg.append(
                  f'<animateMotion '
                  f'dur="{DURATION:.2f}s" '
                  f'begin="-{delay:.3f}s" '
                  f'repeatCount="indefinite" '
                  f'path="{path}" '
                  f'rotate="auto"/>'
              )


              svg.append("</circle>")


          # ========================================================
          # HEAD
          # ========================================================

          svg.append(
              '<use href="#snakeHead" '
              'filter="url(#strongGlow)">'
          )


          svg.append(
              f'<animateMotion '
              f'dur="{DURATION:.2f}s" '
              f'repeatCount="indefinite" '
              f'path="{path}" '
              f'rotate="auto"/>'
          )


          svg.append("</use>")


          # ========================================================
          # END
          # ========================================================

          svg.append("</svg>")


          output = Path(
              "dist/neon-snake.svg"
          )


          output.write_text(
              "\n".join(svg),
              encoding="utf-8"
          )


          print()
          print("========================================")
          print("NEON SNAKE GENERATED")
          print("========================================")
          print(f"Grid:       {COLS} x {ROWS}")
          print(f"Cells:      {len(route)}")
          print(f"Snake:      {SNAKE_LENGTH}")
          print(f"Mushrooms:  {len(mushroom_cells)}")
          print(f"Duration:   {DURATION:.2f}s")
          print(f"File:       {output}")
          print("========================================")


          PY

          python3 /tmp/generate_snake.py


      # ============================================================
      # CHECK OUTPUT
      # ============================================================

      - name: Check generated files
        shell: bash
        run: |
          echo "=========================================="
          echo "FILES TO PUBLISH"
          echo "=========================================="

          find dist -maxdepth 1 -type f -print

          echo ""
          echo "SVG files:"

          ls -lh dist/*.svg


      # ============================================================
      # PUBLISH TO OUTPUT
      # ============================================================

      - name: Publish arcade SVGs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🎮 Update arcade animations"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
