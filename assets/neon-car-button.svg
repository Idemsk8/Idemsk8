<svg width="520" height="150" viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg">

<defs>

    <filter id="glow">
        <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
        <feMerge>
            <feMergeNode in="blur"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
        </feMerge>
    </filter>

    <linearGradient id="road" x1="0" x2="1">
        <stop offset="0" stop-color="#05070f"></stop>
        <stop offset="0.5" stop-color="#0b1724"></stop>
        <stop offset="1" stop-color="#05070f"></stop>
    </linearGradient>

</defs>

<!-- фон -->

<rect x="2" y="2" width="516" height="146" rx="20" fill="url(#road)" stroke="#006b9c" stroke-width="2" filter="url(#glow)"></rect>

<!-- неоновые полосы -->

<g opacity="0.5">

    <path d="M20 120 L130 120" stroke="#00d4ff" stroke-width="3"></path>

    <path d="M390 120 L500 120" stroke="#00d4ff" stroke-width="3"></path>

    <path d="M50 30 L170 30" stroke="#123d55" stroke-width="2"></path>

    <path d="M350 30 L470 30" stroke="#123d55" stroke-width="2"></path>

</g>


<!-- дорога -->

<path d="M20 115 H500" stroke="#263b48" stroke-width="2" stroke-dasharray="25 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-43" dur="0.45s" repeatCount="indefinite"></animate>
</path>


<!-- машина -->

<g transform="translate(260 78)" filter="url(#glow)">

    <!-- лёгкое покачивание -->

    <animateTransform attributeName="transform" type="translate" values="260 78;260 75;260 78" dur="1.1s" repeatCount="indefinite"></animateTransform>

    <!-- кузов -->

    <path d="M-78 20
           L-62 -10
           Q-55 -25 -38 -27
           L38 -27
           Q55 -25 62 -10
           L78 20
           Q82 30 70 32
           L-70 32
           Q-82 30 -78 20Z" fill="#00d4ff"></path>

    <!-- крыша -->

    <path d="M-42 -25
           L-27 -48
           Q-22 -55 0 -55
           Q22 -55 27 -48
           L42 -25Z" fill="#0a2940" stroke="#a0f0ff" stroke-width="2"></path>

    <!-- стекло -->

    <path d="M-28 -43 L-17 -25 H17 L28 -43Z" fill="#071019"></path>

    <!-- фары -->

    <rect x="-65" y="0" width="18" height="8" rx="3" fill="#ffffff">

        <animate attributeName="opacity" values="1;0.45;1" dur="0.7s" repeatCount="indefinite"></animate>

    </rect>

    <rect x="47" y="0" width="18" height="8" rx="3" fill="#ffffff">

        <animate attributeName="opacity" values="0.45;1;0.45" dur="0.7s" repeatCount="indefinite"></animate>

    </rect>

    <!-- колёса -->

    <circle cx="-48" cy="30" r="14" fill="#020305" stroke="#00d4ff" stroke-width="3"></circle>

    <circle cx="48" cy="30" r="14" fill="#020305" stroke="#00d4ff" stroke-width="3"></circle>

</g>


<!-- текст -->

<text x="260" y="137" text-anchor="middle" fill="#a0f0ff" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="4">
    ▶ START NEON ROAD
</text>

</svg>
